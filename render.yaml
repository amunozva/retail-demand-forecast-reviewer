# Render Blueprint configuration for the ORIGINAL Python MCP adapter.
# Authentication: Do NOT remove the bearer-token check to bypass setup.
# A bearer-token-protected server may require a supported connection method
# in ChatGPT (such as an approved tunnel/OAuth path).
services:
  - type: web
    name: retail-demand-forecast-reviewer
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_AUTH_MODE
        value: oauth
      - key: AUTH0_DOMAIN
        value: dev-b8nt1qlq3zd4hjh5.us.auth0.com
      - key: MCP_RESOURCE_URI
        value: https://retail-demand-forecast-reviewer.onrender.com/mcp
      - key: AUTH0_REQUIRED_SCOPE
        value: forecast:read
